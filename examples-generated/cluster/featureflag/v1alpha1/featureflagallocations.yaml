apiVersion: featureflag.upbound.io/v1alpha1
kind: FeatureFlagAllocations
metadata:
  annotations:
    meta.upbound.io/example-id: featureflag/v1alpha1/featureflagallocations
  labels:
    testing.upbound.io/example-name: checkout_production
  name: checkout-production
spec:
  forProvider:
    allocations:
    - key: checkout-redesign-staff-production
      name: Checkout redesign for staff
      targetingRules:
      - conditions:
        - attribute: user.tier
          operator: EQUALS
          value:
          - staff
      type: FEATURE_GATE
      variantWeights:
      - value: 100
        variantKey: "on"
    environmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    featureFlagIdSelector:
      matchLabels:
        testing.upbound.io/example-name: checkout

---

apiVersion: featureflag.upbound.io/v1alpha1
kind: FeatureFlag
metadata:
  annotations:
    meta.upbound.io/example-id: featureflag/v1alpha1/featureflagallocations
  labels:
    testing.upbound.io/example-name: checkout
  name: checkout
spec:
  forProvider:
    defaultVariantKey: "off"
    key: checkout-redesign
    name: Checkout redesign
    valueType: BOOLEAN
    variants:
    - key: "off"
      name: "Off"
      value: "false"
    - key: "on"
      name: "On"
      value: "true"

---

apiVersion: featureflag.upbound.io/v1alpha1
kind: FeatureFlagEnvironment
metadata:
  annotations:
    meta.upbound.io/example-id: featureflag/v1alpha1/featureflagallocations
  labels:
    testing.upbound.io/example-name: production
  name: production
spec:
  forProvider:
    name: Production
    queries:
    - env:production

---

apiVersion: featureflag.upbound.io/v1alpha1
kind: FeatureFlagEnvironmentConfig
metadata:
  annotations:
    meta.upbound.io/example-id: featureflag/v1alpha1/featureflagallocations
  labels:
    testing.upbound.io/example-name: checkout_production
  name: checkout-production
spec:
  forProvider:
    enabled: true
    environmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    featureFlagIdSelector:
      matchLabels:
        testing.upbound.io/example-name: checkout
